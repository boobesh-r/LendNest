# ==============================================================
# LendNest Fly.io Production Configuration
# Permanent 24/7 Hosting with Persistent SQLite & Upload Storage
# ==============================================================

app = "lendnest-platform"
primary_region = "sin" # Singapore region (low latency to India)

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  PORT = "5000"
  DATABASE_PATH = "/app/data/lendnest.sqlite"
  UPLOADS_DIR = "/app/data/uploads"
  FRONTEND_URL = "https://lendnest-platform.fly.dev"
  CORS_ORIGIN = "https://lendnest-platform.fly.dev"
  ENABLE_DEMO_SERVICES = "true"

[http_service]
  internal_port = 5000
  force_https = true
  auto_stop_machines = false   # Keep online 24/7 (zero cold starts for PowerPoint presentations)
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [[http_service.checks]]
    grace_period = "15s"
    interval = "30s"
    method = "GET"
    path = "/api/health"
    timeout = "5s"

[mounts]
  source = "lendnest_data"
  destination = "/app/data"
  initial_size = "1gb"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
