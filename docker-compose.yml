services:
  lendnest:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lendnest_app
    restart: unless-stopped
    ports:
      - "${PORT:-5000}:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET must be set in .env}
      - DATABASE_PATH=/app/database/lendnest.sqlite
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:5000}
      - CORS_ORIGIN=${CORS_ORIGIN:-http://localhost:5000}
      - ENABLE_DEMO_SERVICES=${ENABLE_DEMO_SERVICES:-false}
    volumes:
      # Persistent SQLite volume ensures all data survives container rebuilds/restarts
      - lendnest_data:/app/database
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:5000/api/health | grep healthy || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  lendnest_data:
    name: lendnest_data
    driver: local
